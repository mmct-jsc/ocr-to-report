# OCR-to-Report — local development stack.
# Production deployments should use this as a reference, NOT a drop-in.
# See ARCHITECTURE.md for production deployment patterns.

name: ocr2r

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILD_TIME: ${BUILD_TIME:-dev}
    image: ocr2r-api:dev
    env_file:
      - path: .env
        required: false
    environment:
      OCR2R_DATABASE_URL: postgresql+asyncpg://ocr2r:ocr2r@postgres:5432/ocr2r
      OCR2R_REDIS_URL: redis://redis:6379/0
      OCR2R_BLOB_BACKEND: s3
      OCR2R_BLOB_ENDPOINT_URL: http://minio:9000
      OCR2R_BLOB_ACCESS_KEY: minioadmin
      OCR2R_BLOB_SECRET_KEY: minioadmin
      OCR2R_BLOB_BUCKET: ocr2r
      # Force production-style serving so uvicorn can spawn multiple
      # workers (reload mode is single-worker only).
      OCR2R_ENV: production
      OCR2R_API_WORKERS: "2"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128M
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: ocr2r-web:dev
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=16M
      - /var/cache/nginx:size=64M
      - /var/run:size=8M
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILD_TIME: ${BUILD_TIME:-dev}
    image: ocr2r-worker:dev
    env_file:
      - path: .env
        required: false
    environment:
      OCR2R_DATABASE_URL: postgresql+asyncpg://ocr2r:ocr2r@postgres:5432/ocr2r
      OCR2R_REDIS_URL: redis://redis:6379/0
      OCR2R_BLOB_BACKEND: s3
      OCR2R_BLOB_ENDPOINT_URL: http://minio:9000
      OCR2R_BLOB_ACCESS_KEY: minioadmin
      OCR2R_BLOB_SECRET_KEY: minioadmin
      OCR2R_BLOB_BUCKET: ocr2r
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128M
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ocr2r
      POSTGRES_PASSWORD: ocr2r
      POSTGRES_DB: ocr2r
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocr2r -d ocr2r"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console UI
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Auto-creates the bucket on startup; exits when done.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/ocr2r &&
        mc ilm rule add --expire-days 7 local/ocr2r 2>/dev/null || true &&
        echo 'minio bucket ready'
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
