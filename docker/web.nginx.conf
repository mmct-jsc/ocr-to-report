# nginx site for the OCR-to-Report Web Operations Console.
#
# - Serves the SPA from /usr/share/nginx/html with HTML5-history fallback
#   so client-side routes like /jobs/:id work on a hard refresh.
# - Proxies /api/* to the API container (stripping the prefix) so the
#   browser stays same-origin and the SDK can use baseUrl="/api" without
#   CORS preflights or extra config.
# - Static assets get long-cache headers; index.html and the manifest
#   stay no-cache so deploys roll over without users picking up stale
#   bundles.
# - A handful of conservative security headers that complement the API's
#   own SecurityHeadersMiddleware.

upstream ocr2r_api {
    server api:8000;
}

server {
    listen      80 default_server;
    server_name _;

    # Standard hardening; the API layer adds its own on responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"   always;
    add_header Referrer-Policy        "no-referrer" always;
    add_header Permissions-Policy     "geolocation=(), camera=(), microphone=()" always;

    # /api/* -> api:8000/* (strip prefix). Multipart uploads up to 25 MB.
    location /api/ {
        proxy_pass         http://ocr2r_api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_read_timeout      120s;
        client_max_body_size    25m;
    }

    # Hashed JS/CSS bundles: long-cache, immutable.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Everything else: SPA fallback. index.html itself stays no-cache so
    # a deploy of a new bundle is picked up on next navigation.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Health probe used by docker compose; not routed to the SPA.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        default_type text/plain;
    }
}
