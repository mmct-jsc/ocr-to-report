[project]
name = "ocr-to-report-cli"
version = "0.3.0"
description = "OCR-to-Report — Typer CLI"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "QuocTran" }]

dependencies = [
    "ocr-to-report-core",
    "ocr-to-report-adapters",
    "ocr-to-report-sdk-py",
    "typer>=0.12.5",
    "rich>=13.9.2",
]

[project.scripts]
ocr-to-report = "ocr_to_report.cli.__main__:main"

[tool.uv.sources]
ocr-to-report-core = { workspace = true }
ocr-to-report-adapters = { workspace = true }
ocr-to-report-sdk-py = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_to_report"]
