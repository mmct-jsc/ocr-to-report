[project]
name = "ocr-to-report-core"
version = "0.2.1"
description = "OCR-to-Report — pure-domain core library (no I/O)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "QuocTran" }]

dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "structlog>=24.4.0",
    "pyyaml>=6.0.2",
    "annotated-types>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_to_report"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md"]
