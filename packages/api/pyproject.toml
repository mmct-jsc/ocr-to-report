[project]
name = "ocr-to-report-api"
version = "0.1.0"
description = "OCR-to-Report — FastAPI server"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "QuocTran" }]

dependencies = [
    "ocr-to-report-core",
    "ocr-to-report-adapters",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "python-multipart>=0.0.10",
    "pyjwt[crypto]>=2.9.0",
    "slowapi>=0.1.9",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]

[project.scripts]
ocr-to-report-api = "ocr_to_report.api.__main__:main"

[tool.uv.sources]
ocr-to-report-core = { workspace = true }
ocr-to-report-adapters = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_to_report"]
