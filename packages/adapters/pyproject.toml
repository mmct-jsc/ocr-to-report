[project]
name = "ocr-to-report-adapters"
version = "0.2.1"
description = "OCR-to-Report — I/O adapters (DB, queue, blob, vision providers)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "QuocTran" }]

dependencies = [
    "ocr-to-report-core",
    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.3",
    "psycopg[binary,pool]>=3.2.3",
    "asyncpg>=0.29.0",
    # Queue + cache + rate limit
    "redis>=5.1.0",
    "arq>=0.26.1",
    # Blob storage (S3-compatible)
    "aioboto3>=13.2.0",
    # Vision: Anthropic primary
    "anthropic>=0.39.0",
    # Image processing
    "pillow>=10.4.0",
    # PDF handling
    "pypdf>=5.0.1",
    "pdf2image>=1.17.0",
    # Crypto (envelope encryption)
    "cryptography>=43.0.0",
    "argon2-cffi>=23.1.0",
    # HTTP for provider calls (httpx-only)
    "httpx>=0.27.0",
    # Tenacity for retries
    "tenacity>=9.0.0",
    # Excel rendering
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
openai = ["openai>=1.51.0"]
google = ["google-cloud-aiplatform>=1.69.0"]
tesseract = ["pytesseract>=0.3.13"]

[tool.uv.sources]
ocr-to-report-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_to_report"]
