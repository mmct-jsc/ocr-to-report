[project]
name = "ocr-to-report-mcp"
version = "0.2.1"
description = "OCR-to-Report — MCP server (Model Context Protocol)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "QuocTran" }]

dependencies = [
    "ocr-to-report-core",
    "ocr-to-report-sdk-py",
    "mcp>=1.0.0",
]

[project.scripts]
ocr-to-report-mcp = "ocr_to_report.mcp.__main__:main"

[tool.uv.sources]
ocr-to-report-core = { workspace = true }
ocr-to-report-sdk-py = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_to_report"]
