[project]
name = "ocr-to-report-sdk-py"
version = "0.1.0"
description = "OCR-to-Report — public Python SDK (HTTP client + core re-export)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "QuocTran" }]

dependencies = [
    "ocr-to-report-core",
    "httpx>=0.27.0",
]

[tool.uv.sources]
ocr-to-report-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_to_report"]
