name: pages

# Deploy the web SPA to GitHub Pages so the public ``/demo`` feature
# tour is available at https://mmct-jsc.github.io/ocr-to-report/. The
# build runs the same Vite pipeline as the docker image but with
# ``DEPLOY_TARGET=pages`` so the base path resolves under the project
# subdirectory.
#
# On Pages there is no API behind the SPA — the demo page is intended
# as a feature tour. Authenticated routes will show "API unreachable"
# which is honest signal, not a bug.
#
# Trigger: every push to main + manual ``workflow_dispatch``.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "sdk-ts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Single concurrent deploy per ref — newer pushes cancel older builds
# but never an in-progress deploy (so the live URL stays consistent).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build SPA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            web/package-lock.json
            sdk-ts/package-lock.json

      - name: Install SDK + web deps
        run: |
          cd sdk-ts && npm ci
          cd ../web && npm ci

      - name: Build (DEPLOY_TARGET=pages)
        env:
          DEPLOY_TARGET: pages
          # Surfaces ``import.meta.env.VITE_STATIC_DEMO === "true"`` at
          # runtime so the SPA can branch: hide the login flow + Sign-in
          # CTAs (no backend to sign into) and show a friendly
          # "Demo mode" indicator instead of the alarming "API
          # unreachable" red dot.
          VITE_STATIC_DEMO: "true"
        run: |
          cd web && npm run build

      - name: Pages prep
        # Vite's build output goes to ``web/dist``. Pages expects the
        # artifact at the repo root of the uploaded artifact.
        run: |
          ls web/dist
          # Ensure 404.html exists for SPA fallback.
          test -f web/dist/404.html || cp web/index.html web/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
