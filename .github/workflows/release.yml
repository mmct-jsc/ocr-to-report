name: release

# Tag-triggered release pipeline.
#
# Build → sign → publish:
#   - Runs the gate-keeping CI checks one more time (lint, mypy, tests).
#   - Builds api/worker/web images for amd64 + arm64.
#   - Pushes to GitHub Container Registry under
#     ghcr.io/<owner>/ocr2r-{api,worker,web}:<tag> + :latest.
#   - Generates an SPDX SBOM per image (Anchore syft action).
#   - Signs each image with sigstore cosign (keyless OIDC).
#   - Creates a GitHub Release with the matching CHANGELOG section.
#
# Trigger: push a tag matching v* (e.g. `git tag v0.2.0 && git push --tags`).
# Manual trigger (workflow_dispatch) is also wired for re-runs without a
# new tag — useful when fixing a publish-only step.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.2.0). Must already exist."
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write     # create GitHub Release
  packages: write     # push to GHCR
  id-token: write     # cosign keyless signing via OIDC
  attestations: write # publish image attestations

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.10.0"
  # Opt the Node.js-based actions onto Node 24 ahead of the June 2026
  # default flip. See ci.yml for the same env var + rationale.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ─── 1. Gate ────────────────────────────────────────────────
  # Re-run the must-pass CI checks. A green tag should fail loudly
  # if it can't build clean.
  gate:
    name: Gate (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-packages --group dev
      - run: uv run ruff check .
      - run: uv run mypy packages
      - run: uv run pytest -m "not integration and not e2e and not load and not contract" -q

  # ─── 2. Resolve tag ─────────────────────────────────────────
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    needs: gate
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ -z "$TAG" || ! "$TAG" =~ ^v.+ ]]; then
            echo "::error::Could not resolve a v* tag from ref or input."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # ─── 3. Build + push + sign each image ──────────────────────
  build:
    name: Build ${{ matrix.image }}
    needs: [gate, resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/api.Dockerfile
          - image: worker
            dockerfile: docker/worker.Dockerfile
          - image: web
            dockerfile: docker/web.Dockerfile
    outputs:
      api-digest: ${{ steps.push.outputs.digest }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/ocr2r-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Generate :v0.2.0, :0.2.0, :0.2, :latest tags from the
          # resolved version. Stable tags only — no pre-release stew.
          tags: |
            type=raw,value=${{ needs.resolve.outputs.tag }}
            type=raw,value=${{ needs.resolve.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve.outputs.tag }}
            type=raw,value=latest

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Multi-arch so it runs on M-series Macs + ARM cloud nodes.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.spdx.json
          if-no-files-found: error

      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless OIDC)
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

      - name: Attest SBOM
        run: |
          cosign attest --yes \
            --predicate sbom-${{ matrix.image }}.spdx.json \
            --type spdxjson \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

  # ─── 4. GitHub Release ──────────────────────────────────────
  release:
    name: GitHub Release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract CHANGELOG section
        id: changelog
        run: |
          # Pull the section for this tag out of CHANGELOG.md so the
          # GitHub Release body matches the canonical changelog.
          VERSION="${{ needs.resolve.outputs.version }}"
          # Strip the v-prefix and any trailing +qualifier for matching.
          # We look for an exact heading match: ## [<version>] — date
          awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "## \\[" ver "\\]") { found=1; print; next }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG section found for $VERSION; using fallback."
            echo "# ${{ needs.resolve.outputs.tag }}" > release-notes.md
            echo "" >> release-notes.md
            echo "_See CHANGELOG.md for the full history._" >> release-notes.md
          fi
          echo "----- release-notes.md -----"
          cat release-notes.md

      - name: Download all SBOMs
        uses: actions/download-artifact@v4
        with:
          pattern: sbom-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            sbom-*.spdx.json
          fail_on_unmatched_files: false
          draft: false
          prerelease: ${{ contains(needs.resolve.outputs.tag, '-') }}

  # ─── 5. Smoke test the published images ─────────────────────
  smoke:
    name: Smoke (pull + /v1/health)
    needs: [resolve, build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # GHCR packages default to private when the org first publishes
      # them. The runner's GITHUB_TOKEN has ``read:packages`` from the
      # workflow's ``packages: write`` declaration, so logging in lets
      # the smoke pull whether or not the package has been flipped
      # public. Operators who want anonymous pulls (the demo case) can
      # also set the package visibility to public — this login keeps
      # the pipeline working in either state.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pull + cosign-verify every shipped image, not just the api. The
      # previous version only smoke-tested ocr2r-api; an image-corruption
      # or signing regression on web/worker would have escaped notice
      # until a user pulled and failed. Looping keeps the surface small
      # and the failure mode loud (one `cosign verify` exits non-zero =
      # whole step fails).
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Pull + cosign-verify all three images
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ needs.resolve.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for img in api worker web; do
            ref="ghcr.io/${OWNER}/ocr2r-${img}:${TAG}"
            echo "::group::Pull ${ref}"
            docker pull "${ref}"
            echo "::endgroup::"
            echo "::group::cosign verify ${ref}"
            cosign verify \
              --certificate-identity-regexp "^https://github.com/${REPO}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${ref}"
            echo "::endgroup::"
          done
      # The web image is just nginx serving static files — verify it
      # actually answers HTTP 200 on / before we declare the release
      # smoke-clean. (api needs more wiring than a smoke job justifies;
      # its image presence + signature is the bar there.)
      - name: Verify web image responds on /
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ needs.resolve.outputs.tag }}
        # The earlier 10-iteration tight loop was too tight: a cold
        # ``docker run`` of a freshly-pulled image can take 3-8 seconds
        # before the port-forward actually starts proxying traffic on
        # GitHub-hosted runners, and the v0.2.0 release happened to land
        # outside that window. Now: 30 attempts × 2-second sleep
        # (~60s ceiling) + ``--connect-timeout 2`` so each curl gives
        # up fast rather than blocking on the default 2-minute TCP
        # timeout. Pre-sleep gives nginx a fighting chance on the very
        # first probe.
        run: |
          set -euo pipefail
          cid=$(docker run -d -p 8080:80 "ghcr.io/${OWNER}/ocr2r-web:${TAG}")
          trap "docker rm -f ${cid} >/dev/null 2>&1 || true" EXIT
          sleep 2
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 2 http://localhost:8080/ || echo "000")
            if [ "${code}" = "200" ]; then
              echo "web image returned 200 on / after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::web image did not return 200 on / after ~60s"
          docker logs "${cid}" || true
          exit 1
