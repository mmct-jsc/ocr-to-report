name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.10.0"
  PYTHON_VERSION: "3.12"
  FORCE_COLOR: "1"
  # Opt the Node.js-based actions (checkout, setup-uv, …) onto Node 24
  # ahead of the June 2026 default flip. Removes the deprecation warning
  # surfaced on every run + proves the workflow survives the bump.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Lint + Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Sync workspace
        run: uv sync --all-packages --group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  typecheck:
    name: mypy --strict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-packages --group dev
      - run: uv run mypy packages

  imports:
    name: Dependency direction (import-linter)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-packages --group dev
      - run: uv run lint-imports

  security:
    name: Security (bandit + pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-packages --group dev
      - run: uv run bandit -c pyproject.toml -r packages
        # pip-audit exits 1 by default on any real CVE in PyPI deps
        # (we want that). ``--strict`` additionally promotes warnings
        # (like "can't audit editable workspace package") to errors —
        # not what we want. With ``--skip-editable`` + no --strict, the
        # workspace members are silently passed over while every real
        # PyPI dep is audited and still fails the run on a vuln.
        #
        # Ignored:
        # * CVE-2026-3219 — pip itself (now fixed in pip 26.1). Pulled in
        #   transitively by pip-api (which pip-audit itself depends on).
        #   pip is a build-time tool, not used at runtime by this app —
        #   we use uv everywhere — so the vuln doesn't reach the shipped
        #   wheel/image. Drop the ignore when pip-api floors >=26.1.
        # * CVE-2026-6357 — same: pip itself; same rationale + fix path.
        # * PYSEC-2025-183 — pyjwt 2.12.1; no fix version published as
        #   of 2026-05-21. Re-evaluate on every dep refresh; remove
        #   when pyjwt ships a patched release.
      - run: |
          uv run pip-audit --skip-editable \
            --ignore-vuln CVE-2026-3219 \
            --ignore-vuln CVE-2026-6357 \
            --ignore-vuln PYSEC-2025-183

  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-packages --group dev
      - name: Run unit + property tests with coverage
        run: |
          uv run pytest \
            -m "not integration and not e2e and not load and not contract" \
            --cov --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  docker-build:
    name: Docker build (api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: ocr2r-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.run_id }}

  trivy:
    name: Container scan (trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          load: true
          tags: ocr2r-api:scan
          cache-from: type=gha
      - name: Trivy scan (gating)
        # Pinned to a real released tag. The action repo uses ``v`` prefix
        # on its tags (``v0.36.0``, ``v0.35.0``, …); the earlier
        # ``0.36.0`` form doesn't resolve. Bump deliberately; ``@master``
        # would be a supply-chain risk.
        #
        # This step gates the build: any CRITICAL/HIGH with a known fix
        # fails the run. Unfixed vulns are ignored — those can only be
        # mitigated by waiting for upstream, so making them block CI
        # would create churn without a remediation path.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ocr2r-api:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Trivy scan (MEDIUM, informational)
        # Companion non-gating pass: surface MEDIUM findings as a build
        # annotation without flapping the gate. Includes unfixed so we
        # see what's accumulating in the base image even if no patch
        # exists yet. ``continue-on-error`` makes this advisory.
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ocr2r-api:scan
          format: table
          severity: MEDIUM
          exit-code: '0'
          ignore-unfixed: false
