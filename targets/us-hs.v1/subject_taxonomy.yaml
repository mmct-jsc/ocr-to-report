id: us-hs.subjects.v1
description: |
  US-HS canonical subject taxonomy.  Hours-per-year values match the
  Polish 4-year liceum curriculum (the first source profile shipped) for
  grades 9-12. Other source profiles may override via tenant overrides.

entries:
  # ─── Languages ─────────────────────────────────────────────
  - canonical_id: L1_NATIVE
    display_name: Polish
    base_hours_default: 108
    base_hours_per_year: {9: 108, 10: 108, 11: 108, 12: 108}
    advanced_hour_bonus: 27

  - canonical_id: L2_ENGLISH
    display_name: English
    base_hours_default: 81
    base_hours_per_year: {9: 81, 10: 81, 11: 81, 12: 81}
    advanced_hour_bonus: 27

  - canonical_id: L2_GERMAN
    display_name: German
    base_hours_default: 54
    base_hours_per_year: {9: 54, 10: 54, 11: 54, 12: 54}
    advanced_hour_bonus: 27

  - canonical_id: L2_FRENCH
    display_name: French
    base_hours_default: 54
    base_hours_per_year: {9: 54, 10: 54, 11: 54, 12: 54}
    advanced_hour_bonus: 27

  - canonical_id: L2_SPANISH
    display_name: Spanish
    base_hours_default: 54
    advanced_hour_bonus: 27
    optional: true

  - canonical_id: L2_RUSSIAN
    display_name: Russian
    base_hours_default: 54
    advanced_hour_bonus: 27
    optional: true

  - canonical_id: LATIN_ANCIENT_CULTURE
    display_name: Latin and Ancient Culture
    base_hours_default: 27
