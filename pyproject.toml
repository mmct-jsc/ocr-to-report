[project]
name = "ocr-to-report-workspace"
version = "0.1.0-dev"
description = "Schema-driven multi-language transcript-to-report SaaS (workspace root)"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "QuocTran" }]

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-httpx>=0.30.0",
    "pytest-recording>=0.13.0",
    "hypothesis>=6.108.0",
    "syrupy>=4.7.0",
    "schemathesis>=3.36.0",
    "import-linter>=2.0",
    "bandit[toml]>=1.7.9",
    "pip-audit>=2.7.3",
    "pre-commit>=3.7.0",
    "httpx>=0.27.0",
    "testcontainers>=4.7.0",
    "anyio>=4.4.0",
    "types-PyYAML>=6.0.12",
    "openpyxl>=3.1.5",
    "aiosqlite>=0.20.0",
    # Workspace members exposed to uv sync --dev
    "ocr-to-report-core",
    "ocr-to-report-adapters",
    "ocr-to-report-api",
    "ocr-to-report-worker",
    "ocr-to-report-cli",
    "ocr-to-report-sdk-py",
    "ocr-to-report-mcp",
]

[tool.uv.sources]
ocr-to-report-core = { workspace = true }
ocr-to-report-adapters = { workspace = true }
ocr-to-report-api = { workspace = true }
ocr-to-report-worker = { workspace = true }
ocr-to-report-cli = { workspace = true }
ocr-to-report-sdk-py = { workspace = true }
ocr-to-report-mcp = { workspace = true }

# ─────────────────────────── ruff ────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# Comprehensive rule set; security rules included via S (bandit-equiv)
select = [
    "E", "F", "W",       # pycodestyle + pyflakes
    "I",                  # isort
    "N",                  # pep8-naming
    "UP",                 # pyupgrade
    "B",                  # bugbear
    "C4",                 # comprehensions
    "DTZ",                # datetime zoning
    "S",                  # bandit security
    "T20",                # print statements
    "PTH",                # pathlib instead of os.path
    "RUF",                # ruff-specific
    "SIM",                # simplify
    "TID",                # tidy imports
    "TCH",                # type-checking blocks
    "ASYNC",              # async correctness
    "ANN",                # missing annotations (relaxed in tests)
    "PL",                 # pylint subset
    "PERF",               # perf anti-patterns
]
ignore = [
    "ANN401",             # allow Any in narrow internal use
    "PLR0913",            # too many args (Pydantic / FastAPI)
    "PLR2004",            # magic value (often clearer than constant)
    "S101",               # assert allowed (we use pytest)
    # TC001-TC003 conflict with Pydantic v2 — runtime needs the imports
    # to resolve forward refs and validate Annotated metadata. Re-enable
    # if we ever migrate off Pydantic.
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py"    = ["S", "ANN", "PLR0915", "PLR2004"]
"**/conftest.py"   = ["S", "ANN"]
"packages/*/tests/**/*.py" = ["S", "ANN", "PLR0915", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["ocr_to_report"]

# ─────────────────────────── mypy ────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_decorators = true
disallow_any_generics = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]
mypy_path = [
    "packages/core/src",
    "packages/adapters/src",
    "packages/api/src",
    "packages/worker/src",
    "packages/cli/src",
    "packages/sdk_py/src",
    "packages/mcp/src",
]
namespace_packages = true
explicit_package_bases = true
exclude = ["migrations/versions/.*"]

[[tool.mypy.overrides]]
module = ["packages.*.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Third-party libs without type stubs; treat as Any at boundaries.
[[tool.mypy.overrides]]
module = ["openpyxl.*", "aioboto3.*", "botocore.*"]
ignore_missing_imports = true

# ─────────────────────────── pytest ──────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests", "packages/core/tests", "packages/adapters/tests", "packages/api/tests", "packages/worker/tests", "packages/cli/tests", "packages/sdk_py/tests", "packages/mcp/tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
    "--import-mode=importlib",
]
markers = [
    "unit: pure unit tests, no I/O",
    "property: hypothesis-driven property tests",
    "integration: requires Postgres/Redis/MinIO via testcontainers",
    "contract: schemathesis OpenAPI contract tests",
    "e2e: hits real provider APIs (gated by LIVE_TESTS=1)",
    "load: locust load tests",
    "slow: tests that take >1s",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources",
]

[tool.coverage.run]
branch = true
source = ["packages"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    "*/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]

# ─────────────── import-linter (dependency direction) ────────
[tool.importlinter]
root_packages = [
    "ocr_to_report.core",
    "ocr_to_report.adapters",
    "ocr_to_report.api",
    "ocr_to_report.worker",
    "ocr_to_report.cli",
    "ocr_to_report.sdk_py",
    "ocr_to_report.mcp",
]

[[tool.importlinter.contracts]]
name = "Layered architecture: entrypoints depend on adapters depend on core"
type = "layers"
layers = [
    "ocr_to_report.api | ocr_to_report.worker | ocr_to_report.cli | ocr_to_report.mcp",
    "ocr_to_report.adapters",
    "ocr_to_report.core",
]

[[tool.importlinter.contracts]]
name = "SDK independence: sdk_py never imports server-side code"
type = "forbidden"
source_modules = ["ocr_to_report.sdk_py"]
forbidden_modules = [
    "ocr_to_report.api",
    "ocr_to_report.worker",
    "ocr_to_report.adapters",
]

# ─────────────────────────── bandit ──────────────────────────
[tool.bandit]
exclude_dirs = ["tests", "packages/*/tests"]
skips = [
    "B101",  # assert (we use pytest)
    "B104",  # hardcoded bind 0.0.0.0 — intentional for containerized deploys
]
