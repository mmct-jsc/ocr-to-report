# alembic.ini — config for the database migration tool.
#
# The actual sqlalchemy.url is set programmatically by migrations/env.py
# from OCR2R_DATABASE_URL so we never check a connection string in.
# Tests override sqlalchemy.url via Config.set_main_option().

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_locations = %(here)s/migrations/versions
sqlalchemy.url = postgresql://ocr2r:ocr2r@localhost:5432/ocr2r

# Stable file naming — date prefix + the slug from `make migration name=...`
file_template = %%(rev)s_%%(slug)s

# Each new revision starts numbered (0001, 0002, …); alembic's default
# truncate_slug_length keeps the human-readable suffix tidy.
truncate_slug_length = 40

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
